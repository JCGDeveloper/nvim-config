# ════════════════════════════════════════════════════════════════════════
#  GlazeWM — tiling window manager para Windows (estilo i3/Hyprland)
#  Ruta destino: %USERPROFILE%\.glzr\glazewm\config.yaml
#
#  Diseñado para convivir con los atajos de VSCode de este repo:
#  - Alt+hjkl       -> foco de VENTANAS (nivel WM, en todas las apps)
#  - Ctrl+hjkl      -> splits DENTRO de VSCode (no los toca el WM)
#  - Alt+Enter      -> libre para VSCode (sugerencia IA); terminal = Win+Enter
#  - Alt+, / Alt+.  -> pestañas del panel de VSCode (antes Alt+h/l)
#
#  Salir del WM: Alt+Shift+E (todo vuelve a la normalidad al instante)
#  Pausar el WM: Alt+Shift+P (toggle)
# ════════════════════════════════════════════════════════════════════════

general:
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '42px' # hueco para la barra Zebar
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7E9CD8' # azul Kanagawa
  other_windows:
    border:
      enabled: true
      color: '#54546D' # gris Kanagawa

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: true
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      # Zebar (la barra)
      - window_process: { equals: 'zebar' }

      # ── Microsoft Teams: popups de llamada/notificación quedan flotando ──
      - window_process: { regex: '(?i)teams' }
        window_title: { regex: '(?i)notificaci|notification|llamada entrante|incoming call|call in progress|meeting compact|screen sharing|compartir pantalla' }

      # Picture-in-picture de navegadores
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # PowerToys y diálogos varios
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }

      # Office: ignorar ventanas auxiliares (solo tilea las principales)
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes: []

keybindings:
  # ── Foco entre ventanas (cruza monitores solo) ──
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction right']
    bindings: ['alt+l']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction down']
    bindings: ['alt+j']

  # ── Mover la ventana enfocada ──
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']

  # ── Resize directo (sin modo, sin trampa): u/p ancho, i/o alto ──
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # ── Pausar/reanudar el WM (por si algo se porta raro en una call) ──
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # ── Dirección de tiling (dónde se inserta la siguiente ventana) ──
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # ── Estados de ventana ──
  # (Alt+Space queda LIBRE para el lanzador tipo rofi — Flow Launcher)
  - commands: ['wm-cycle-focus']
    bindings: ['alt+g']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']

  # ── Salir / recargar ──
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # ── Terminal: Win+Enter (Alt+Enter queda libre para VSCode) ──
  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']

  # ── Workspaces ──
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # ── Mover ventana a workspace (y seguirla) ──
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']

  # ── Multi-monitor: mover el workspace entero a otro monitor ──
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']
